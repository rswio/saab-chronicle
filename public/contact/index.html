<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Rename My Town</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(640px, 92vw);
        background: #111827;
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 2rem;
        box-sizing: border-box;
      }

      h1 {
        margin: 0 0 1rem;
      }

      p {
        line-height: 1.6;
        margin: 0 0 1rem;
      }

      a {
        color: #7dd3fc;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Contact</h1>
      <p>
        This contact endpoint now uses Cloudflare Email Routing.
      </p>
      <p>
        Please email <a href="mailto:good.comms@renamemytown.com">good.comms@renamemytown.com</a>.
      </p>
    </main>
  </body>
</html>
